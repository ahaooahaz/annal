[Metadata]
Name=Squirrel Light
Name[zh_CN]=鼠须管·浅色
Version=1
Author=Annal
Description=Approximate Squirrel's native light colors and compact horizontal layout.

[InputPanel]
NormalColor=#000000d8
HighlightColor=#000000d8
HighlightBackgroundColor=#b3d7ff
HighlightCandidateColor=#000000d8
# Newer Fcitx5 supports independent label/comment sizes and colors.
# 18 pt * 67% is approximately Squirrel's 12 pt label font.
LabelTextSizeFactor=67
CandidateLabelColor=#0000007f
HighlightCandidateLabelColor=#0000007f
CommentTextSizeFactor=100
CandidateCommentColor=#0000007f
HighlightCandidateCommentColor=#0000007f
FullWidthHighlight=False

[InputPanel/Background]
Image=background.svg
Color=#ffffffee
BorderWidth=0

[InputPanel/Background/Margin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/Highlight]
Image=highlight.svg
Color=#b3d7ff
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

# Content + text margins give the first/last candidate 8 px of side padding.
[InputPanel/ContentMargin]
Left=4
Right=4
Top=1
Bottom=1

[InputPanel/TextMargin]
Left=4
Right=4
Top=1
Bottom=1

[Menu]
NormalColor=#000000d8
HighlightCandidateColor=#000000d8

