Color=#ffffffee
BorderWidth=0

[Menu/Background/Margin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Image=highlight.svg
Color=#b3d7ff
BorderWidth=0

[Menu/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/ContentMargin]
