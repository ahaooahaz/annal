[Metadata]
Name=Squirrel Dark
Name[zh_CN]=鼠须管·深色
Version=1
Author=Annal
Description=Approximate Squirrel's native dark colors and compact horizontal layout.

[InputPanel]
NormalColor=#ffffffd8
HighlightColor=#ffffffd8
HighlightBackgroundColor=#3f638b
HighlightCandidateColor=#ffffffd8
# Newer Fcitx5 supports independent label/comment sizes and colors.
# 18 pt * 67% is approximately Squirrel's 12 pt label font.
LabelTextSizeFactor=67
CandidateLabelColor=#ffffff8c
HighlightCandidateLabelColor=#ffffff8c
CommentTextSizeFactor=100
CandidateCommentColor=#ffffff8c
HighlightCandidateCommentColor=#ffffff8c
FullWidthHighlight=False

[InputPanel/Background]
Image=background.svg
Color=#1e1e1eee
BorderWidth=0

[InputPanel/Background/Margin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/Highlight]
Image=highlight.svg
Color=#3f638b
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

# Content + text margins give the first/last candidate 8 px of side padding.
[InputPanel/ContentMargin]
Left=4
Right=4
Top=1
Bottom=1

[InputPanel/TextMargin]
Left=4
Right=4
Top=1
Bottom=1

[Menu]
NormalColor=#ffffffd8
HighlightCandidateColor=#ffffffd8

[Menu/Background]
Image=background.svg
Color=#1e1e1eee
BorderWidth=0

[Menu/Background/Margin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Image=highlight.svg
Color=#3f638b
BorderWidth=0

[Menu/Highlight/Margin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/TextMargin]
Left=4
Right=4
Top=2
Bottom=2

[Menu/Separator]
Color=#ffffff20
