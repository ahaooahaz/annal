# kitty_mod has to be modifiers not keys, see
# https://github.com/kovidgoyal/kitty/discussions/3457#discussioncomment-587511
# so you can NOT do this: kitty_mod ctrl+f
kitty_mod ctrl+shift 

# 取消单击左键打开链接，需要ctrl+左键打开链接.
mouse_map left click ungrabbed no-op
# ctrl+鼠标左键打开选中的链接.
mouse_map kitty_mod+left click ungrabbed mouse_handle_click selection link prompt
# 左键选中复制.
mouse_map kitty_mod+left press ungrabbed mouse_selection normal
# 右键按下粘贴.
mouse_map right press ungrabbed paste_from_selection

#map kitty_mod+enter new_window
# disable this as can lead to window created by accident via press by ctrl+shift+v paste command and then press enter
map kitty_mod+enter no-op
map cmd+enter       no-op

map kitty_mod+x close_window
map kitty_mod+] next_tab
map kitty_mod+[ previous_tab
map kitty_mod+period move_tab_forward
map kitty_mod+comma move_tab_backward
map kitty_mod+t new_tab_with_cwd
# map kitty_mod+t new_tab
# map kitty_mod+t launch --location=hsplit
# new_tab will not keep cwd, use `new_tab_with_cwd` instead or `launch --cwd=current --type=tab`
# see https://sw.kovidgoyal.net/kitty/faq/#how-do-i-open-a-new-window-or-tab-with-the-same-working-directory-as-the-current-window
# tmux like tab create via `--cwd=last_reported`, warning: this need kitty `shell_integration enabled`
map ctrl+s>c launch --cwd=last_reported --type=tab
map ctrl+s>, set_tab_title
#: Increase font size
#map ctrl+equal  change_font_size all +2.0
#map ctrl+plus   change_font_size all +2.0
#map ctrl+kp_add change_font_size all +2.0
#: Decrease font size
#map ctrl+minus       change_font_size all -2.0
#map ctrl+kp_subtract change_font_size all -2.0
#: Reset font size
#map ctrl+0 change_font_size all 0
map f11 toggle_fullscreen
map f12 kitten toggle_background_opacity.py
# map ctrl+f>e edit_config_file
map ctrl+s>e no-op
#: Reload kitty.conf
map ctrl+s>shift+r combine : load_config_file : launch --type=overlay --hold --allow-remote-control kitty @ send-text "kitty config reloaded"
#: Debug kitty configuration
# map ctrl+s>shift+d     debug_config

# default alphabet see https://github.com/kovidgoyal/kitty/blob/0c4b20aa4e6b29ccf7c389e15d7ff5189f8e98f5/kittens/hints/main.py#L125
# qwerty alphabets borrow from https://github.com/fcsonline/tmux-thumbs#Alphabets
map f3 kitten hints --alphabet asdfqwerzxcvjklmiuopghtybn1234567890 --customize-processing custom-hints.py
# map f3 kitten hints --program @

# https://github.com/console-rs/console/pull/85/files
# https://github.com/console-rs/console/pull/84
# map double ctrl+f to ctrl+f (home)
map ctrl+s>ctrl+s send_text all \x13

# 纵向分割一个窗口输入搜索的关键字
map kitty_mod+f      launch --location=hsplit --allow-remote-control kitty +kitten kitty-kitten-search/search.py @active-kitty-window-id

# kitty grab
map ctrl+s>v kitten kitty_grab/grab.py

map ctrl+s>g open_url_with_hints
map kitty_mod+enter toggle_maximized

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
# tmux like window split via `--cwd=last_reported`, warning: this need kitty `shell_integration enabled`
#map F5 launch --location=hsplit --cwd=last_reported
map kitty_mod+minus launch --location=hsplit --cwd=last_reported

# workaround for ssh kitten
# map ctrl+s>shift+minus launch --location=hsplit


# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
# tmux like window split via `--cwd=last_reported`, warning: this need kitty `shell_integration enabled`
#map F6 launch --location=vsplit --cwd=last_reported
map kitty_mod+backslash launch --location=vsplit --cwd=last_reported

# map ctrl+s>shift+backslash launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
# map F4 launch --location=split

# Rotate the current split, chaging its split axis from vertical to
# horizontal or vice versa
map F7 layout_action rotate

# Move the active window in the indicated direction
map kitty_mod+up move_window up
map kitty_mod+left move_window left
map kitty_mod+right move_window right
map kitty_mod+down move_window down

# Switch focus to the neighboring window in the indicated direction
# map ctrl+left neighboring_window left
# map ctrl+right neighboring_window right
# map ctrl+up neighboring_window up
# map ctrl+down neighboring_window down

map ctrl+s>h neighboring_window left
map ctrl+s>l neighboring_window right
map ctrl+s>k neighboring_window up
map ctrl+s>j neighboring_window down

# https://sw.kovidgoyal.net/kitty/layouts/#window-resizing
map alt+n resize_window narrower
map alt+w resize_window wider
map alt+t resize_window taller
map alt+s resize_window shorter 3
# reset all windows in the tab to default sizes
map alt+r resize_window reset

# zoom toggle https://sw.kovidgoyal.net/kitty/kittens/custom/#using-kittens-to-script-kitty-without-any-terminal-ui
map ctrl+s>z kitten zoom_toggle.py
# https://sw.kovidgoyal.net/kitty/actions/#action-toggle_layout
#map ctrl+s>z toggle_layout stack

# https://sw.kovidgoyal.net/kitty/faq/#how-do-i-change-the-colors-in-a-running-kitty-instance
map ctrl+s>t kitten themes

map ctrl+s>q focus_visible_window

map ctrl+s>1 goto_tab 1
map ctrl+s>2 goto_tab 2
map ctrl+s>3 goto_tab 3
map ctrl+s>4 goto_tab 4
map ctrl+s>5 goto_tab 5
map ctrl+s>6 goto_tab 6
map ctrl+s>7 goto_tab 7
map ctrl+s>8 goto_tab 8
map ctrl+s>9 goto_tab 9
map ctrl+s>0 goto_tab 10

# map ctrl+s>s launch --type=overlay --hold --allow-remote-control ~/.config/kitty/dump-sesison.sh

map kitty_mod+q close_os_window

