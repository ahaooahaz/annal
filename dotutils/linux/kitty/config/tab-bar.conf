   # Minimal Tab bar styling
   # Add this at Bottom of Kitty.conf
tab_bar_edge                top
tab_bar_style               custom
tab_bar_custom_style        tab_bar
tab_title_template          "◌ {index}:{(f'{title.removeprefix("~")[:6]}…{title.removeprefix("~")[-6:]}' if len(title.removeprefix("~")) > 13 else title.removeprefix("~"))}{' [Q]' if layout_name == 'stack' else ''}"
tab_powerline_style         slanted
tab_separator               ""
tab_bar_min_tabs            2
tab_fade                    0 0 0 0

active_tab_title_template   "◉ {index}:{(f'{title.removeprefix("~")[:6]}…{title.removeprefix("~")[-6:]}' if len(title.removeprefix("~")) > 13 else title.removeprefix("~"))}{' [Q]' if layout_name == 'stack' else ''}"
active_tab_font_style       bold-italic

inactive_tab_font_style     normal
