add_newline = false

palette = "kanagawa-dragon"
scan_timeout = 100

format = """$username\
$hostname\
$directory\
$sudo\
${env_var.gsd_remote}\
${env_var.gsd_branch}\
${env_var.gsd_status}\
${env_var.gsd_ahead_behind}\
${env_var.gsd_action}\
${package}${nodejs}${python}${bun}${golang}${php}\
${battery}\
$fill${cmd_duration}\n${time}$character"""

[palettes.kanagawa-dragon]

background = "#181616"
current_line = "#2d4f67"
foreground = "#f5f5f5"
comment = "#b0b0c0"

cyan = "#00d7ff"
green = "#50fa7b"
orange = "#ff9f1c"
pink = "#ff3b9d"
purple = "#bd93f9"
red = "#ff5f5f"
yellow = "#ffe600"
white = "#ffffff"
blue = "#5fafff"


[directory.substitutions]
"Escritorio" = "󰟀 "

[directory]
style = "bold cyan"
read_only = "  "
read_only_style = "yellow"
home_symbol = "~"
truncation_symbol = "…/"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vicmd_symbol = "[v](bold purple)"

[username]
show_always = true
style_user = "bold pink"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold purple"
format = "@[$hostname]($style) "

[sudo]
symbol = " "
style = "red"
disabled = false

[container]
symbol = ' '
style = 'bold red dimmed'
format = '[$symbol \[$name\] ]($style)'

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style)"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
EndeavourOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Pop = " "

[git_branch]
disabled = true

[git_status]
disabled = true

[env_var.gsd_remote]
variable = 'GSD_REMOTE'
style = 'foreground'
format = '[$env_value ]($style)'

[env_var.gsd_repo]
variable = 'GSD_REPO'
style = 'bold orange'
format = '[$env_value ]($style)'

[env_var.gsd_branch]
variable = 'GSD_BRANCH'
style = "bold orange"
format = '[on  $env_value ]($style)'

[env_var.gsd_status]
variable = 'GSD_STATUS'
style = 'bold red'
format = '[$env_value ]($style)'

[env_var.gsd_ahead_behind]
variable = 'GSD_AHEAD_BEHIND'
style = 'bold yellow'
format = '[$env_value ]($style)'

[env_var.gsd_action]
variable = 'GSD_ACTION'
style = 'bold yellow'
format = '[\($env_value\) ]($style)'

[package]
symbol = " "
style = "yellow"

[nodejs]
symbol = " "
style = "green"

[python]
symbol = " "
style = "blue"

[bun]
symbol = " "
style = "yellow"

[golang]
symbol = " "
style = "cyan"

[php]
symbol = " "
style = "purple"

[time]
disabled = false
time_format = "%H:%M "
style = "cyan"
format = "[$time]($style)"

[battery]
disabled = false
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
format = '[$symbol$percentage]($style) '

[[battery.display]]
threshold = 100
style = "bold green"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = '[ took $duration]($style) '
