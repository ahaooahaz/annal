# Minimal Linux authentication screen — inspired by layout17.png.
# Self-contained configuration for Hyprlock 0.9.7.
# No desktop screenshot, external palette, images, or helper scripts.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    disable_screencopy = true
}

animations {
    enabled = false
}

# Pure black on every monitor; desktop contents are never captured.
background {
    monitor =
    path =
    color = rgba(000000ff)
    blur_passes = 0
}

# Top-center date and 24-hour time, always in English.
label {
    monitor =
    text = cmd[update:1000] LC_ALL=C date +'<b>%A, %B %-d - %H:%M:%S</b>'
    color = rgba(d8dee3e6)
    font_size = 15
    font_family = Adwaita Mono
    position = 0, -30
    halign = center
    valign = top
    text_align = center
    zindex = 2
}

# Traditional square-corner authentication frame.
shape {
    monitor =
    size = 500, 100
    position = 0, 0
    halign = center
    valign = center
    color = rgba(000000ff)
    rounding = 0
    border_size = 2
    border_color = rgba(eeeeeeff)
    shadow_passes = 0
    zindex = 0
}

# Black backing interrupts the frame's top border behind its title.
shape {
    monitor =
    size = 228, 20
    position = -120, 50
    halign = center
    valign = center
    color = rgba(000000ff)
    rounding = 0
    border_size = 0
    shadow_passes = 0
    zindex = 20
}

label {
    monitor =
    text = <b>Authenticate into archlinux</b>
    color = rgba(d8dee3cc)
    font_size = 11
    font_family = Adwaita Sans
    position = -120, 50
    halign = center
    valign = center
    text_align = center
    zindex = 21
}

label {
    monitor =
    text = <b>Username:</b>
    color = rgba(d8dee3cc)
    font_size = 11
    font_family = Adwaita Mono
    position = -190, 15
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgba(d8dee3cc)
    font_size = 11
    font_family = Adwaita Mono
    position = -127, 15
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>Password:</b>
    color = rgba(d8dee3cc)
    font_size = 11
    font_family = Adwaita Mono
    position = -190, -15
    halign = center
    valign = center
    zindex = 2
}

# Borderless password entry on the same line as the Password label.
# Center-relative positioning works on every monitor, unlike a fixed x=800.
input-field {
    monitor =
    size = 320, 40
    position = 5.5, -15
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = rgba(eeeeeeff)
    font_family = Adwaita Sans
    placeholder_text =
    fade_on_empty = false
    hide_input = false
    dots_center = false
    dots_size = 0.30
    dots_spacing = 0.35
    dots_rounding = -1
    dots_text_format =
    check_text =
    check_color = rgba(eeeeeeff)
    fail_text =
    fail_color = rgba(eeeeeeff)
    capslock_color = rgba(eacb8aff)
    bothlock_color = rgba(eacb8aff)
    swap_font_color = true
    shadow_passes = 0
    zindex = 2
}

# Authentication status overlay, sharing Hyprlock's native password/auth state.
# Invisible while typing. During verification/failure the opaque black fill
# covers Username/Password, and huge pure-red text fills the frame interior.
# hide_input suppresses duplicate password dots; it does not change PAM.
input-field {
    monitor =
    size = 496, 96
    position = 0, 0
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = rgba(ff0000ff)
    font_family = Adwaita Sans
    placeholder_text =
    fade_on_empty = false
    hide_input = true
    check_text = <span size="53248" weight="heavy" foreground="red" letter_spacing="16384">Verify...</span>
    check_color = rgba(000000ff)
    fail_text = <span size="53248" weight="heavy" foreground="red" letter_spacing="24576">FAILED</span>
    fail_color = rgba(000000ff)
    capslock_color = rgba(00000000)
    numlock_color = rgba(00000000)
    bothlock_color = rgba(00000000)
    swap_font_color = false
    shadow_passes = 0
    zindex = 10
}
