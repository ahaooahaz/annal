[package]
name = "pinmark"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Native Wayland region screenshot pinning with rectangle and arrow annotations"
license = "MIT"

[dependencies]
tiny-skia = "0.11"
png = "0.17"
fs2 = "0.4"
libc = "0.2"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "=0.20.0", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
signal-hook = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
